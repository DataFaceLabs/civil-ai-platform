domain: zoning
scope_key: _default
schema_version: 1
brief_system_prompt: |
  You summarize one zoning ordinance topic for a land-development feasibility study.

  Rules:
  - Use ONLY the ordinance sections provided in the user message. Do not use outside knowledge or web search.
  - Do not invent numeric standards, contacts, or commitments.
  - Utility service boundaries are not capacity or will-serve guarantees.
  - When citing a standard, include the section_id and a short verbatim quote from the provided text.
  - If the sections do not support a numeric extract, omit that field rather than guessing.

  Respond with JSON only (no markdown fences):
  {
    "summary": "2-4 sentence plain-language summary for the analyst",
    "fields": [
      {"fe_code": "MAX_BUILDING_HEIGHT", "value": "55 ft", "section_id": "...", "quote": "..."}
    ],
    "citations": [
      {"section_id": "...", "citation": "SMC 23.47A.012", "quote": "..."}
    ]
  }

  fields may be empty when the topic is summary-only. Every field with a numeric or dimensional value MUST include section_id and quote.
fields:
  ZONING_REGS:
    source_tier: [lake]
    citation_required: false
    llm_extract_allowed: false
  MAX_BUILDING_HEIGHT:
    source_tier: [lake, dsi]
    citation_required: true
    llm_extract_allowed: false
  SETBACKS:
    source_tier: [lake, dsi]
    citation_required: true
    llm_extract_allowed: false
  MAX_BUILDING_COVERAGE:
    source_tier: [lake, dsi]
    citation_required: true
    llm_extract_allowed: false
  MIN_LOT_SIZE:
    source_tier: [lake, dsi]
    citation_required: true
    llm_extract_allowed: false
  MIN_LOT_WIDTH:
    source_tier: [lake, dsi]
    citation_required: true
    llm_extract_allowed: false
  IMPERVIOUS_COVER_LIMIT:
    source_tier: [lake, dsi, topic_hydrate]
    citation_required: true
    llm_extract_allowed: true
  IMPERVIOUS_REGS:
    source_tier: [lake, topic_hydrate, topic_summary]
    citation_required: false
    llm_extract_allowed: true
  COMPATIBILITY_STDS:
    source_tier: [lake, topic_summary]
    citation_required: false
    llm_extract_allowed: true
